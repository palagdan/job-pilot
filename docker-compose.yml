# Local development infrastructure. Start: `pnpm infra:up` · stop: `pnpm infra:down` · wipe data: `pnpm infra:reset`
name: job-pilot

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: jobpilot
      POSTGRES_PASSWORD: jobpilot
      POSTGRES_DB: jobpilot
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates `jobpilot_test` for integration tests (runs on first start only).
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobpilot -d jobpilot"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage (MinIO no longer publishes community images).
  # The app only uses the S3 API, so production can be R2 / S3 without code changes.
  storage:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: jobpilot
      RUSTFS_SECRET_KEY: jobpilot-secret
    ports:
      - "${STORAGE_PORT:-9000}:9000" # S3 API
      - "${STORAGE_CONSOLE_PORT:-9001}:9001" # web console
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-off: creates the bucket, then exits.
  storage-init:
    image: amazon/aws-cli:2.38.6
    depends_on:
      storage:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: jobpilot
      AWS_SECRET_ACCESS_KEY: jobpilot-secret
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        aws --endpoint-url http://storage:9000 s3api head-bucket --bucket jobpilot 2>/dev/null
        || aws --endpoint-url http://storage:9000 s3 mb s3://jobpilot
    restart: "no"

  # Catches all outgoing email; inbox UI on http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.32.0
    ports:
      - "${SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"

volumes:
  postgres-data:
  storage-data:
